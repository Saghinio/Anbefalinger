<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>Min katalog</title>
<style>
  :root{
    --wood-dark:#241B17;
    --wood:#2E2420;
    --wood-light:#3B2E27;
    --wood-edge:#150F0C;
    --paper:#FBF6EA;
    --paper-line: rgba(60,40,30,0.09);
    --ink:#2B211C;
    --ink-soft:#5c5148;
    --cream:#F0E9DC;
    --cream-dim:#c9bda9;

    --c-books:#8B4049;      --c-books-soft:#F3E4E1;
    --c-movies:#2C5F5D;     --c-movies-soft:#DCEAE8;
    --c-series:#B8862E;     --c-series-soft:#F5E9D2;
    --c-games:#3F5D3A;      --c-games-soft:#E1E8DC;
    --c-activities:#6B4C6E; --c-activities-soft:#E9E0EA;
    --c-prefs:#3d4f66;      --c-prefs-soft:#dfe5ec;
    --c-recs:#8a5a2e;       --c-recs-soft:#f0e2cd;

    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --mono: ui-monospace, 'SFMono-Regular', Consolas, 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: var(--serif);
    color: var(--ink);
    background:
      radial-gradient(ellipse at top, var(--wood-light), var(--wood) 60%),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.05) 0 2px, transparent 2px 26px);
    background-blend-mode: normal;
    min-height:100vh;
    padding: 28px 14px 60px;
  }
  .wrap{ max-width: 780px; margin: 0 auto; }

  header.top{
    text-align:left;
    padding: 6px 10px 20px;
    border-bottom: 1px solid rgba(240,233,220,0.15);
    margin-bottom: 18px;
  }
  header.top h1{
    color: var(--cream);
    font-size: 1.9rem;
    font-weight: 400;
    margin: 0 0 4px;
    letter-spacing: 0.3px;
  }
  header.top p{
    color: var(--cream-dim);
    font-family: var(--mono);
    font-size: 0.78rem;
    margin: 0;
  }

  .tabs{
    display:flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items:flex-end;
    padding: 0 4px;
  }
  .tab{
    font-family: var(--serif);
    font-size: 0.92rem;
    color: var(--cream-dim);
    background: rgba(255,255,255,0.04);
    border: none;
    border-top: 3px solid transparent;
    border-radius: 8px 8px 0 0;
    padding: 9px 14px 8px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
    display:flex; align-items:center; gap:6px;
  }
  .tab:hover{ color: var(--cream); }
  .tab.active{
    background: var(--paper);
    color: var(--ink);
    transform: translateY(3px);
    border-top-color: var(--tab-accent, #999);
    box-shadow: 0 -2px 14px -4px var(--tab-accent, transparent);
  }

  .panel{
    background: var(--paper);
    background-image: repeating-linear-gradient(var(--paper) 0 27px, var(--paper-line) 27px 28px);
    border-radius: 0 8px 8px 8px;
    padding: 26px 26px 10px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.35);
    position: relative;
    min-height: 260px;
  }
  .panel::before{
    content:"";
    position:absolute; top:0; bottom:0; left: 54px;
    width:1px; background: rgba(160,50,50,0.18);
    pointer-events:none;
  }
  .panel-inner{ padding-left: 4px; }

  section.block{ margin-bottom: 26px; }
  section.block h2{
    font-size: 1.05rem;
    font-weight: 400;
    margin: 0 0 10px;
    color: var(--accent, var(--ink));
    display:flex; align-items:center; justify-content:space-between;
  }
  section.block h2 .count{
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--ink-soft);
    font-weight: normal;
  }
  .subhint{
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--ink-soft);
    margin: -6px 0 14px;
  }

  .empty{
    font-family: var(--mono);
    font-size: 0.82rem;
    color: var(--ink-soft);
    padding: 4px 0 10px;
  }

  ul.items{ list-style:none; margin:0; padding:0; }
  ul.items li{
    padding: 8px 6px 8px 0;
    border-bottom: 1px solid var(--paper-line);
    display:flex;
    gap: 10px;
    align-items:flex-start;
  }
  ul.items li:last-child{ border-bottom:none; }
  .item-main{ flex:1; min-width:0; }
  .item-title{ font-size: 0.98rem; }
  .item-title .extra{ color: var(--ink-soft); font-style: italic; }
  .item-note{ color: var(--ink-soft); font-size: 0.88rem; margin-top: 2px; }
  .item-meta{
    font-family: var(--mono);
    font-size: 0.74rem;
    color: var(--ink-soft);
    margin-top: 3px;
    display:flex; gap: 10px; flex-wrap: wrap;
    align-items:center;
  }
  .badge{
    display:inline-block;
    font-family: var(--mono);
    font-size: 0.72rem;
    padding: 1px 7px;
    border-radius: 3px;
    background: var(--accent-soft, #eee);
    color: var(--accent, #333);
  }
  .item-actions{ display:flex; flex-direction:column; gap:4px; align-items:flex-end; }
  .del-btn{
    border:none; background:none; cursor:pointer;
    color: var(--ink-soft); font-size: 1rem; line-height:1;
    padding: 2px 4px; opacity: 0.55;
  }
  .del-btn:hover{ opacity: 1; color:#8B4049; }
  .mark-btn{
    font-family: var(--mono);
    font-size: 0.68rem;
    border: 1px solid var(--accent, #999);
    color: var(--accent, #333);
    background: var(--accent-soft, #eee);
    padding: 3px 8px;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  .mark-btn:hover{ filter: brightness(0.95); transform: translateY(-1px); }
  .mark-row{ display:flex; gap:6px; margin-top:4px; }

  .add-link{
    font-family: var(--mono);
    font-size: 0.78rem;
    background:none; border: 1px dashed var(--ink-soft);
    color: var(--ink-soft);
    padding: 4px 10px;
    border-radius: 4px;
    cursor:pointer;
    margin-top: 6px;
  }
  .add-link:hover{ border-color: var(--accent, #333); color: var(--accent, #333); }

  form.add-form{
    margin-top: 10px;
    padding: 12px;
    background: rgba(0,0,0,0.03);
    border-radius: 6px;
    display:grid;
    gap: 8px;
  }
  form.add-form .row{ display:flex; gap:8px; flex-wrap:wrap; }
  form.add-form input, form.add-form textarea, form.add-form select{
    font-family: var(--serif);
    font-size: 0.9rem;
    border: 1px solid rgba(0,0,0,0.18);
    border-radius: 4px;
    padding: 6px 8px;
    background: #fff;
    color: var(--ink);
    flex: 1 1 140px;
  }
  form.add-form textarea{ width:100%; min-height: 44px; resize: vertical; font-family: var(--serif); }
  form.add-form .rating-select{ flex: 0 0 90px; }
  form.add-form .type-select{ flex: 0 0 130px; }
  form.add-form .date-input{ flex: 0 0 150px; }
  .form-actions{ display:flex; gap:8px; justify-content:flex-end; }
  .btn{
    font-family: var(--mono);
    font-size: 0.78rem;
    padding: 6px 12px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
  }
  .btn.save{ background: var(--accent, #333); color: #fff; }
  .btn.cancel{ background: transparent; color: var(--ink-soft); }

  .tag-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom: 10px; }
  .tag{
    background: var(--accent-soft, #eee);
    color: var(--accent, #333);
    font-family: var(--mono);
    font-size: 0.78rem;
    padding: 4px 10px 4px 12px;
    border-radius: 14px;
    display:flex; align-items:center; gap:6px;
  }
  .tag button{
    border:none; background:none; cursor:pointer; color: inherit; opacity:0.6; font-size:0.9rem; line-height:1;
  }
  .tag button:hover{ opacity:1; }
  .tag-add{ display:flex; gap:6px; }
  .tag-add input{
    font-family: var(--serif); font-size: 0.88rem;
    border: 1px solid rgba(0,0,0,0.18); border-radius: 4px;
    padding: 5px 8px; flex:1;
  }

  .search-row{
    margin-top: 14px;
    display:flex;
    align-items:center;
    gap: 8px;
    max-width: 420px;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(240,233,220,0.18);
    border-radius: 22px;
    padding: 8px 8px 8px 16px;
    box-shadow: 0 0 0 rgba(216,166,90,0);
    transition: box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .search-row:focus-within{
    border-color: rgba(216,166,90,0.5);
    box-shadow: 0 0 0 3px rgba(216,166,90,0.12);
  }
  .search-row input{
    flex:1;
    background: none;
    border: none;
    outline: none;
    color: var(--cream);
    font-family: var(--serif);
    font-size: 0.92rem;
  }
  .search-row input::placeholder{ color: var(--cream-dim); }
  .search-row button{
    border:none; background:none; cursor:pointer;
    color: var(--cream-dim); font-size: 0.9rem;
    padding: 2px 6px; border-radius: 50%;
    display:none;
  }
  .search-row button:hover{ color: var(--cream); }
  .search-row.has-query button{ display:inline-block; }

  .search-summary{
    font-family: var(--mono); font-size: 0.78rem; color: var(--ink-soft);
    margin-bottom: 16px;
  }
  .search-group{ margin-bottom: 22px; }
  .search-group h3{
    font-size: 0.95rem; font-weight: 400; margin: 0 0 8px;
    color: var(--accent, var(--ink));
  }
  .search-result-list{ list-style:none; margin:0; padding:0; }
  .search-result-list li{
    padding: 8px 0; border-bottom: 1px solid var(--paper-line);
    display:flex; gap:10px; align-items:flex-start;
  }
  .search-result-list li:last-child{ border-bottom:none; }
  .jump-btn{
    font-family: var(--mono); font-size: 0.68rem;
    border: 1px solid var(--accent, #999); color: var(--accent, #333);
    background: var(--accent-soft, #eee);
    padding: 3px 9px; border-radius: 10px; cursor:pointer;
    white-space: nowrap;
    transition: transform 0.12s ease, filter 0.12s ease;
  }
  .jump-btn:hover{ filter: brightness(0.95); transform: translateY(-1px); }
  .mark-form{
    margin-top: 8px;
    padding: 10px 12px;
    background: rgba(0,0,0,0.035);
    border-radius: 10px;
    display:grid;
    gap: 8px;
    border: 1px solid rgba(0,0,0,0.06);
  }
  .mark-form-row{ display:flex; align-items:center; gap: 14px; flex-wrap:wrap; }
  .who-toggle{
    display:flex; gap: 4px;
    background: rgba(0,0,0,0.05);
    border-radius: 20px;
    padding: 3px;
  }
  .who-toggle label{
    font-family: var(--mono);
    font-size: 0.78rem;
    padding: 5px 12px;
    border-radius: 16px;
    cursor: pointer;
    display:flex; align-items:center; gap:5px;
    color: var(--ink-soft);
    transition: background 0.15s ease, color 0.15s ease;
  }
  .who-toggle input{ accent-color: var(--ink); }
  .who-toggle label:has(input:checked){
    background: var(--ink);
    color: var(--paper);
  }
  .dice-select{ flex: 0 0 90px; }
  .dice-badge{
    font-size: 0.8rem;
    letter-spacing: 0.5px;
  }

  .sync-status{
    font-family: var(--mono);
    font-size: 0.7rem;
    color: var(--cream-dim);
    margin: 8px 0 0;
    opacity: 0.85;
  }
  .sync-status.sync-error{ color: #d98a7a; opacity: 1; }

  .status-msg{
    font-family: var(--mono); font-size:0.75rem; color: var(--cream-dim);
    padding: 10px 4px; text-align:center;
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Min katalog</h1>
    <p id="subtitle">laster …</p>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Søk på tvers av alt – f.eks. en tittel …" autocomplete="off">
      <button id="searchClear" title="Tøm søk">✕</button>
    </div>
    <p id="syncStatus" class="sync-status">kobler til …</p>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"><div class="panel-inner" id="panelInner"></div></div>
</div>

<script>
const SUPABASE_URL = 'https://kdclszlycvarvjbuhuaj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fHr287JzbN58_C2KhmfObg_BhpmGNII';
const SUPABASE_HEADERS = {
  'apikey': SUPABASE_KEY,
  'Authorization': `Bearer ${SUPABASE_KEY}`,
  'Content-Type': 'application/json'
};

const CATEGORIES = [
  { id:'books', label:'Bøker', icon:'📚', accentVar:'--c-books', softVar:'--c-books-soft',
    extraLabel:'Forfatter', extraPlaceholder:'F.eks. Karl Ove Knausgård',
    logExtraLabel:'Forfatter', hasRating:true, singular:'bok',
    likerBlocks:[ {key:'liker', label:'Liker'}, {key:'ikke', label:'Liker ikke'} ] },
  { id:'movies', label:'Filmer', icon:'🎬', accentVar:'--c-movies', softVar:'--c-movies-soft',
    extraLabel:null, logExtraLabel:null, hasRating:true, singular:'film',
    likerBlocks:[ {key:'vi', label:'Vi liker'}, {key:'jeg', label:'Jeg liker'}, {key:'ikke', label:'Liker ikke'} ] },
  { id:'series', label:'Serier', icon:'📺', accentVar:'--c-series', softVar:'--c-series-soft',
    extraLabel:null, logExtraLabel:'Sesong/status', logExtraPlaceholder:'F.eks. S2 – fullført',
    hasRating:true, singular:'serie',
    likerBlocks:[ {key:'vi', label:'Vi liker'}, {key:'jeg', label:'Jeg liker'}, {key:'ikke', label:'Liker ikke'} ] },
  { id:'games', label:'Spill', icon:'🎮', accentVar:'--c-games', softVar:'--c-games-soft',
    extraLabel:null, logExtraLabel:null, hasRating:true, singular:'spill',
    likerBlocks:[ {key:'liker', label:'Liker'}, {key:'ikke', label:'Liker ikke'} ] },
  { id:'activities', label:'Aktiviteter', icon:'🎯', accentVar:'--c-activities', softVar:'--c-activities-soft',
    extraLabel:null, logExtraLabel:null, hasRating:false, singular:'aktivitet',
    likerBlocks:[ {key:'liker', label:'Liker'}, {key:'ikke', label:'Liker ikke'} ] },
];

const PREF_LISTS = [
  { id:'foretrekker', label:'Sjangre jeg foretrekker', placeholder:'F.eks. science fiction' },
  { id:'unngar', label:'Sjangre jeg unngår', placeholder:'F.eks. skrekk' },
  { id:'stemning', label:'Stemning jeg ofte er ute etter', placeholder:'F.eks. koselig og lavmælt' },
];

function uid(){ return Math.random().toString(36).slice(2, 10); }

function seedRecommendations(){
  return [
    { id: uid(), type:'movies', title:'Freefall: A Reckoning for Boeing', note:'Dokumentar om Boeing-skandalene.' },
    { id: uid(), type:'movies', title:'Chris & Martina: The Final Set', note:'Sportsdokumentar om Chris Evert og Martina Navratilova.' },
    { id: uid(), type:'movies', title:'The Perfect Neighbor', note:'Sterk dokumentar bygget på politiets egne opptak.' },
    { id: uid(), type:'series', title:'Toxic Town', note:'Miniserie om mødre som saksøker myndighetene etter et miljøskandale.' },
    { id: uid(), type:'series', title:'The Spy', note:'Miniserie med Sacha Baron Cohen som den israelske spionen Eli Cohen.' },
    { id: uid(), type:'series', title:'Radioactive Emergency', note:'Dramathriller inspirert av en reell atomkatastrofe.' },
    { id: uid(), type:'series', title:'Delhi Crime', note:'Prisbelønt drama basert på en reell og profilert kriminalsak i India.' },
    { id: uid(), type:'movies', title:'Best of the Best', note:'Fersk Netflix-komedie.' },
    { id: uid(), type:'movies', title:'53 Sundays', note:'Spansk dramakomedie, varm og litt bittersøt.' },
    { id: uid(), type:'movies', title:'Eat Pray Bark', note:'Lettere tysk komedie.' },
    { id: uid(), type:'movies', title:'Toaster', note:'Lettere indisk komedie.' },
    { id: uid(), type:'movies', title:'Hamnet', note:'Basert på Maggie O\u2019Farrells roman, Golden Globe-vinner.' },
    { id: uid(), type:'series', title:'My Brilliant Career', note:'Miniserie basert på en klassisk roman.' },
    { id: uid(), type:'series', title:'Death by Lightning', note:'Miniserie om attentatet på president Garfield.' },
    { id: uid(), type:'series', title:'House of Guinness', note:'Periodedrama om Guinness-familiens historie.' },
    { id: uid(), type:'movies', title:'On Behalf of My Son', note:'Portugisisk drama om en mor som kjemper for sønnen sin.' },
    { id: uid(), type:'movies', title:'A Letter to My Youth', note:'Indonesisk drama om å gjøre opp med fortid og familie.' },
    { id: uid(), type:'movies', title:'CODA', note:'Om en hørende datter i en døv familie. NB: ligger på Apple TV+, ikke Netflix.' },
  ];
}

function seedMoviesVi(){
  return [
    { id: uid(), title:'Ibelin', note:'Dokumentar (2024) om en ung World of Warcraft-spiller.' },
    { id: uid(), title:'Forlis: Mareritt til sjøs', note:'Dokumentar (2026) om en cruisekatastrofe.' },
    { id: uid(), title:'Je m\u2019appelle Agneta', note:'Drama (2026), svensk.' },
    { id: uid(), title:'Hillbilly Elegy', note:'Drama (2020), Oscar-nominert.' },
    { id: uid(), title:'Ruth & Boaz', note:'Drama (2025), moderne versjon av Ruts bok.' },
    { id: uid(), title:'Togdrømmer', note:'Drama (2025), basert på Denis Johnsons novelle, Oscar-nominert.' },
    { id: uid(), title:'The Dig', note:'Drama (2021), med Carey Mulligan og Ralph Fiennes.' },
    { id: uid(), title:'Føl stemmen min', note:'Drama (2026).' },
    { id: uid(), title:'Den siste kjempen', note:'Drama (2026), argentinsk, med Oscar Martínez.' },
  ];
}

function seedSeriesVi(){
  return [
    { id: uid(), title:'Alt lyset vi ikke ser', note:'Miniserie, Drama (2023), basert på Anthony Doerrs roman.' },
  ];
}

function defaultData(){
  const d = { preferences: {}, recommendations: seedRecommendations() };
  CATEGORIES.forEach(c => {
    d[c.id] = { log: [] };
    c.likerBlocks.forEach(b => { d[c.id][b.key] = []; });
  });
  d.movies.vi = seedMoviesVi();
  d.series.vi = seedSeriesVi();
  PREF_LISTS.forEach(p => { d.preferences[p.id] = []; });
  return d;
}

let state = null;
let activeTab = 'movies';
let openForms = {};
let markingOpen = {}; // recommendation id -> bool, shows Vi/Jeg choice
let searchQuery = '';

function setSyncStatus(text, isError){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  el.textContent = text;
  el.classList.toggle('sync-error', !!isError);
}

async function loadData(){
  try{
    setSyncStatus('Henter fra Supabase …', false);
    const res = await fetch(`${SUPABASE_URL}/rest/v1/katalog?id=eq.main&select=data`, {
      headers: SUPABASE_HEADERS
    });
    if(!res.ok) throw new Error(`Supabase svarte ${res.status}`);
    const rows = await res.json();
    const raw = rows && rows[0] && rows[0].data;
    if(raw && Object.keys(raw).length > 0){
      const base = defaultDataShapeOnly();
      state = Object.assign(base, raw);
      CATEGORIES.forEach(c=>{
        const shape = { log: [] };
        c.likerBlocks.forEach(b => shape[b.key] = []);
        state[c.id] = Object.assign(shape, state[c.id]);
      });
      state.preferences = Object.assign(defaultPrefsShape(), state.preferences);
      if(!Array.isArray(state.recommendations)) state.recommendations = [];
      const patched = await applyPendingPatches();
      setSyncStatus(patched ? 'Lagret i Supabase' : 'Synkronisert med Supabase', false);
      return;
    }
    // Row exists but is empty, or no row yet — seed it.
    state = defaultData();
    await applyPendingPatches();
    await saveData();
    setSyncStatus('Lagret i Supabase', false);
  }catch(e){
    console.error('Kunne ikke hente fra Supabase:', e);
    setSyncStatus('Fikk ikke kontakt med Supabase – sjekk URL/nøkkel og at tabellen finnes', true);
    state = defaultData();
  }
}

async function applyPendingPatches(){
  // One-off additions requested in chat, applied without overwriting existing data.
  let changed = false;
  const alreadyHiddenLife = state.movies.vi.some(it => it.title.toLowerCase() === 'a hidden life');
  if(!alreadyHiddenLife){
    state.movies.vi.push({
      id: uid(),
      title: 'A Hidden Life',
      rating: '6',
      note: 'Vakker natur, veldig bra spilt, men tung og trist. Basert på faktiske hendelser.'
    });
    changed = true;
  }
  const alreadyFrihetensRegn = state.movies.jeg.some(it => it.title.toLowerCase() === 'frihetens regn');
  if(!alreadyFrihetensRegn){
    state.movies.jeg.push({
      id: uid(),
      title: 'Frihetens Regn',
      rating: '6'
    });
    changed = true;
  }
  if(changed){
    await saveData();
  }
  return changed;
}

function defaultDataShapeOnly(){
  const d = { preferences: defaultPrefsShape(), recommendations: [] };
  CATEGORIES.forEach(c => {
    d[c.id] = { log: [] };
    c.likerBlocks.forEach(b => { d[c.id][b.key] = []; });
  });
  return d;
}
function defaultPrefsShape(){
  const p = {};
  PREF_LISTS.forEach(pl => { p[pl.id] = []; });
  return p;
}

async function saveData(){
  try{
    setSyncStatus('Lagrer …', false);
    const res = await fetch(`${SUPABASE_URL}/rest/v1/katalog?on_conflict=id`, {
      method: 'POST',
      headers: Object.assign({}, SUPABASE_HEADERS, {
        'Prefer': 'resolution=merge-duplicates,return=minimal'
      }),
      body: JSON.stringify([{ id: 'main', data: state, updated_at: new Date().toISOString() }])
    });
    if(!res.ok){
      const body = await res.text();
      throw new Error(`Supabase svarte ${res.status}: ${body}`);
    }
    setSyncStatus('Lagret i Supabase', false);
  }catch(e){
    console.error('Kunne ikke lagre:', e);
    setSyncStatus('Kunne ikke lagre i Supabase – prøv igjen', true);
  }
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function formatDate(iso){
  if(!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('no-NO', { year:'numeric', month:'short', day:'numeric' });
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  const all = [
    ...CATEGORIES,
    { id:'recommendations', label:'Anbefalinger', icon:'⭐', accentVar:'--c-recs' },
    { id:'preferences', label:'Preferanser', icon:'🧭', accentVar:'--c-prefs' }
  ];
  tabsEl.innerHTML = all.map(c => {
    const accent = getComputedStyle(document.documentElement).getPropertyValue(c.accentVar).trim();
    const active = c.id === activeTab ? 'active' : '';
    return `<button class="tab ${active}" style="--tab-accent:${accent}" data-tab="${c.id}">
      <span>${c.icon}</span><span>${c.label}</span>
    </button>`;
  }).join('');
  tabsEl.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeTab = btn.dataset.tab;
      searchQuery = '';
      const input = document.getElementById('searchInput');
      if(input) input.value = '';
      updateSearchRowState();
      render();
    });
  });
}

function ratingOptions(selected){
  let out = '<option value="">–</option>';
  for(let i=1;i<=6;i++){
    out += `<option value="${i}" ${String(selected)===String(i)?'selected':''}>${i}</option>`;
  }
  return out;
}

function renderLikerBlock(cat, key, title){
  const accent = `var(${cat.accentVar})`;
  const soft = `var(${cat.softVar})`;
  const items = state[cat.id][key];
  const formKey = `${cat.id}-${key}`;
  const showForm = !!openForms[formKey];

  let itemsHtml = '';
  if(items.length === 0){
    itemsHtml = `<div class="empty">Ingenting lagt til ennå.</div>`;
  } else {
    itemsHtml = `<ul class="items">` + items.map(it => `
      <li>
        <div class="item-main">
          <div class="item-title">${escapeHtml(it.title)}${it.extra ? ` <span class="extra">– ${escapeHtml(it.extra)}</span>`:''} ${cat.hasRating && it.rating ? `<span class="badge dice-badge" style="--accent:${accent};--accent-soft:${soft}">${diceFace(it.rating)} ${it.rating}/6</span>` : ''}</div>
          ${it.note ? `<div class="item-note">${escapeHtml(it.note)}</div>` : ''}
        </div>
        <button class="del-btn" data-del="${cat.id}|${key}|${it.id}" title="Fjern">✕</button>
      </li>`).join('') + `</ul>`;
  }

  let formHtml = '';
  if(showForm){
    formHtml = `
      <form class="add-form" data-add="${cat.id}|${key}">
        <div class="row">
          <input type="text" name="title" placeholder="Tittel" required>
          ${cat.extraLabel ? `<input type="text" name="extra" placeholder="${cat.extraLabel}">` : ''}
          ${cat.hasRating ? `<select name="rating" class="rating-select">${ratingOptions('')}</select>` : ''}
        </div>
        <textarea name="note" placeholder="Hvorfor / hvorfor ikke"></textarea>
        <div class="form-actions">
          <button type="button" class="btn cancel" data-cancel="${formKey}">Avbryt</button>
          <button type="submit" class="btn save" style="background:${accent}">Lagre</button>
        </div>
      </form>`;
  }

  return `
    <section class="block" style="--accent:${accent}">
      <h2>${title} <span class="count">${items.length}</span></h2>
      ${itemsHtml}
      ${!showForm ? `<button class="add-link" data-open="${formKey}">+ Legg til</button>` : formHtml}
    </section>`;
}

function renderLogBlock(cat){
  const accent = `var(${cat.accentVar})`;
  const soft = `var(${cat.softVar})`;
  const items = [...state[cat.id].log].sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  const formKey = `${cat.id}-log`;
  const showForm = !!openForms[formKey];

  let itemsHtml = '';
  if(items.length === 0){
    itemsHtml = `<div class="empty">Ingenting logget ennå.</div>`;
  } else {
    itemsHtml = `<ul class="items">` + items.map(it => `
      <li>
        <div class="item-main">
          <div class="item-title">${escapeHtml(it.title)}${it.extra ? ` <span class="extra">– ${escapeHtml(it.extra)}</span>` : ''}</div>
          <div class="item-meta">
            <span>${formatDate(it.date)}</span>
            ${cat.hasRating && it.rating ? `<span class="badge dice-badge" style="--accent:${accent};--accent-soft:${soft}">${diceFace(it.rating)} ${it.rating}/6</span>` : ''}
          </div>
          ${it.note ? `<div class="item-note">${escapeHtml(it.note)}</div>` : ''}
        </div>
        <button class="del-btn" data-del="${cat.id}|log|${it.id}" title="Fjern">✕</button>
      </li>`).join('') + `</ul>`;
  }

  let formHtml = '';
  if(showForm){
    formHtml = `
      <form class="add-form" data-add="${cat.id}|log">
        <div class="row">
          <input type="date" name="date" class="date-input" required>
          <input type="text" name="title" placeholder="Tittel" required>
          ${cat.hasRating ? `<select name="rating" class="rating-select">${ratingOptions('')}</select>` : ''}
        </div>
        ${cat.logExtraLabel ? `<input type="text" name="extra" placeholder="${cat.logExtraPlaceholder || cat.logExtraLabel}">` : ''}
        <textarea name="note" placeholder="Kort notat"></textarea>
        <div class="form-actions">
          <button type="button" class="btn cancel" data-cancel="${formKey}">Avbryt</button>
          <button type="submit" class="btn save" style="background:${accent}">Lagre</button>
        </div>
      </form>`;
  }

  const logTitle = logTitleFor(cat);

  return `
    <section class="block" style="--accent:${accent}">
      <h2>${logTitle} <span class="count">${items.length}</span></h2>
      ${itemsHtml}
      ${!showForm ? `<button class="add-link" data-open="${formKey}">+ Registrer</button>` : formHtml}
    </section>`;
}

function diceFace(n){
  const faces = ['','\u2680','\u2681','\u2682','\u2683','\u2684','\u2685'];
  return faces[Number(n)] || '';
}

function logTitleFor(cat){
  return cat.id === 'activities' ? 'Gjort' : (cat.id === 'series' ? 'Sett' : (cat.id === 'books' ? 'Lest' : 'Sett/spilt'));
}

function textMatches(it, q){
  return (it.title && it.title.toLowerCase().includes(q)) ||
         (it.extra && it.extra.toLowerCase().includes(q)) ||
         (it.note && it.note.toLowerCase().includes(q));
}

function runSearch(query){
  const q = query.trim().toLowerCase();
  if(!q) return [];
  const results = [];
  CATEGORIES.forEach(cat=>{
    cat.likerBlocks.forEach(b=>{
      state[cat.id][b.key].forEach(it=>{
        if(textMatches(it, q)) results.push({ cat, tabId: cat.id, listLabel: b.label, item: it });
      });
    });
    state[cat.id].log.forEach(it=>{
      if(textMatches(it, q)) results.push({ cat, tabId: cat.id, listLabel: logTitleFor(cat), item: it, isLog: true });
    });
  });
  state.recommendations.forEach(it=>{
    if(textMatches(it, q)){
      const typeLabel = it.type === 'series' ? 'Serie' : 'Film';
      results.push({ cat: null, tabId: 'recommendations', listLabel: `Anbefaling – ${typeLabel}`, item: it });
    }
  });
  return results;
}

function renderSearchResults(query){
  const results = runSearch(query);
  const accent = 'var(--c-recs)';
  if(results.length === 0){
    return `<div class="search-summary">Ingen treff på «${escapeHtml(query)}» – hverken i lister, logg eller anbefalinger.</div>`;
  }
  const grouped = {};
  results.forEach(r=>{
    const groupKey = r.cat ? `${r.cat.icon} ${r.cat.label}` : '⭐ Anbefalinger';
    grouped[groupKey] = grouped[groupKey] || [];
    grouped[groupKey].push(r);
  });
  let html = `<div class="search-summary">${results.length} treff på «${escapeHtml(query)}»</div>`;
  Object.keys(grouped).forEach(groupKey=>{
    const groupAccent = grouped[groupKey][0].cat ? `var(${grouped[groupKey][0].cat.accentVar})` : accent;
    html += `<div class="search-group" style="--accent:${groupAccent}">
      <h3>${groupKey}</h3>
      <ul class="search-result-list">
      ${grouped[groupKey].map(r=>{
        const it = r.item;
        const dateBit = r.isLog && it.date ? `<span class="item-meta"><span>${formatDate(it.date)}</span>${it.rating ? `<span class="badge dice-badge" style="--accent:${groupAccent}">${diceFace(it.rating)} ${it.rating}/6</span>` : ''}</span>` : '';
        return `
        <li>
          <div class="item-main">
            <div class="item-title">${escapeHtml(it.title)}${it.extra ? ` <span class="extra">– ${escapeHtml(it.extra)}</span>` : ''} <span class="badge" style="--accent:${groupAccent}">${escapeHtml(r.listLabel)}</span></div>
            ${dateBit}
            ${it.note ? `<div class="item-note">${escapeHtml(it.note)}</div>` : ''}
          </div>
          <button class="jump-btn" style="--accent:${groupAccent}" data-jump="${r.tabId}">Gå til fane</button>
        </li>`;
      }).join('')}
      </ul>
    </div>`;
  });
  return html;
}

function renderCategoryPanel(cat){
  const hasSplit = cat.likerBlocks.some(b => b.key === 'vi' || b.key === 'jeg');
  const hint = hasSplit ? `<div class="subhint">Merk hva dere liker sammen, og hva du liker å se alene.</div>` : '';
  return `
    ${hint}
    ${cat.likerBlocks.map(b => renderLikerBlock(cat, b.key, b.label)).join('')}
    ${renderLogBlock(cat)}
  `;
}

function renderPrefsPanel(){
  const accent = `var(--c-prefs)`;
  const soft = `var(--c-prefs-soft)`;
  return PREF_LISTS.map(p => {
    const tags = state.preferences[p.id];
    const tagsHtml = tags.length
      ? tags.map(t => `<span class="tag" style="--accent:${accent};--accent-soft:${soft}">${escapeHtml(t.text)}<button data-del="preferences|${p.id}|${t.id}">✕</button></span>`).join('')
      : `<div class="empty">Ingen lagt til ennå.</div>`;
    return `
      <section class="block" style="--accent:${accent}">
        <h2>${p.label}</h2>
        <div class="tag-row">${tagsHtml}</div>
        <form class="tag-add" data-pref="${p.id}">
          <input type="text" name="text" placeholder="${p.placeholder}">
          <button type="submit" class="btn save" style="background:${accent}">Legg til</button>
        </form>
      </section>`;
  }).join('');
}

function renderRecommendationsPanel(){
  const accent = `var(--c-recs)`;
  const soft = `var(--c-recs-soft)`;
  const items = state.recommendations;
  const formKey = 'recs-add';
  const showForm = !!openForms[formKey];

  let itemsHtml = '';
  if(items.length === 0){
    itemsHtml = `<div class="empty">Ingen anbefalinger liggende ennå.</div>`;
  } else {
    itemsHtml = `<ul class="items">` + items.map(it => {
      const catLabel = it.type === 'series' ? 'Serie' : 'Film';
      const showMark = !!markingOpen[it.id];
      return `
      <li>
        <div class="item-main">
          <div class="item-title">${escapeHtml(it.title)} <span class="badge" style="--accent:${accent};--accent-soft:${soft}">${catLabel}</span></div>
          ${it.note ? `<div class="item-note">${escapeHtml(it.note)}</div>` : ''}
          ${showMark
            ? `<form class="mark-form" data-markform="${it.id}|${it.type}">
                 <div class="mark-form-row">
                   <div class="who-toggle">
                     <label><input type="radio" name="who" value="vi" checked> Vi</label>
                     <label><input type="radio" name="who" value="jeg"> Jeg</label>
                   </div>
                   <select name="rating" class="rating-select dice-select">${ratingOptions('')}</select>
                 </div>
                 <div class="form-actions">
                   <button type="button" class="btn cancel" data-mark-cancel="${it.id}">Avbryt</button>
                   <button type="submit" class="btn save" style="background:${accent}">Lagre</button>
                 </div>
               </form>`
            : `<div class="mark-row"><button class="mark-btn" style="--accent:${accent};--accent-soft:${soft}" data-mark-open="${it.id}">✓ Sett</button></div>`
          }
        </div>
        <button class="del-btn" data-del="recommendations||${it.id}" title="Fjern">✕</button>
      </li>`;
    }).join('') + `</ul>`;
  }

  let formHtml = '';
  if(showForm){
    formHtml = `
      <form class="add-form" data-add="recommendations|list">
        <div class="row">
          <select name="type" class="type-select">
            <option value="movies">Film</option>
            <option value="series">Serie</option>
          </select>
          <input type="text" name="title" placeholder="Tittel" required>
        </div>
        <textarea name="note" placeholder="Kort notat om hvorfor det er anbefalt"></textarea>
        <div class="form-actions">
          <button type="button" class="btn cancel" data-cancel="${formKey}">Avbryt</button>
          <button type="submit" class="btn save" style="background:${accent}">Lagre</button>
        </div>
      </form>`;
  }

  return `
    <div class="subhint">Ting du kan hake av som sett, og velge om dere så det sammen eller du så det alene.</div>
    <section class="block" style="--accent:${accent}">
      <h2>Anbefalinger <span class="count">${items.length}</span></h2>
      ${itemsHtml}
      ${!showForm ? `<button class="add-link" data-open="${formKey}">+ Legg til anbefaling</button>` : formHtml}
    </section>`;
}

function render(){
  renderTabs();
  const inner = document.getElementById('panelInner');
  if(searchQuery.trim()){
    inner.innerHTML = renderSearchResults(searchQuery);
  } else if(activeTab === 'preferences'){
    inner.innerHTML = renderPrefsPanel();
  } else if(activeTab === 'recommendations'){
    inner.innerHTML = renderRecommendationsPanel();
  } else {
    const cat = CATEGORIES.find(c=>c.id===activeTab);
    inner.innerHTML = renderCategoryPanel(cat);
  }
  attachHandlers();
}

function attachHandlers(){
  document.querySelectorAll('[data-jump]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      activeTab = btn.dataset.jump;
      searchQuery = '';
      const input = document.getElementById('searchInput');
      if(input) input.value = '';
      updateSearchRowState();
      render();
    });
  });
  document.querySelectorAll('[data-open]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ openForms[btn.dataset.open] = true; render(); });
  });
  document.querySelectorAll('[data-cancel]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ openForms[btn.dataset.cancel] = false; render(); });
  });
  document.querySelectorAll('[data-mark-open]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ markingOpen[btn.dataset.markOpen] = true; render(); });
  });
  document.querySelectorAll('[data-mark-cancel]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ markingOpen[btn.dataset.markCancel] = false; render(); });
  });
  document.querySelectorAll('form[data-markform]').forEach(form=>{
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const [recId, type] = form.dataset.markform.split('|');
      const rec = state.recommendations.find(r=>r.id===recId);
      if(!rec) return;
      const fd = new FormData(form);
      const who = fd.get('who') || 'vi';
      const rating = fd.get('rating') || null;
      const newItem = { id: uid(), title: rec.title, note: rec.note || '' };
      if(rating) newItem.rating = rating;
      state[type][who].push(newItem);
      state.recommendations = state.recommendations.filter(r=>r.id!==recId);
      delete markingOpen[recId];
      await saveData();
      render();
    });
  });
  document.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const [catId, key, id] = btn.dataset.del.split('|');
      if(catId === 'preferences'){
        state.preferences[key] = state.preferences[key].filter(t=>t.id!==id);
      } else if(catId === 'recommendations'){
        state.recommendations = state.recommendations.filter(r=>r.id!==id);
      } else {
        state[catId][key] = state[catId][key].filter(it=>it.id!==id);
      }
      await saveData();
      render();
    });
  });
  document.querySelectorAll('form[data-add]').forEach(form=>{
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const [catId, key] = form.dataset.add.split('|');
      const fd = new FormData(form);
      if(catId === 'recommendations'){
        const title = (fd.get('title')||'').trim();
        if(!title) return;
        state.recommendations.push({ id: uid(), type: fd.get('type') || 'movies', title, note: (fd.get('note')||'').trim() });
        openForms['recs-add'] = false;
        await saveData();
        render();
        return;
      }
      const item = { id: uid() };
      if(key === 'log'){
        item.date = fd.get('date') || new Date().toISOString().slice(0,10);
        item.title = (fd.get('title')||'').trim();
        if(!item.title) return;
        if(fd.has('extra')) item.extra = (fd.get('extra')||'').trim();
        if(fd.has('rating')) item.rating = fd.get('rating') || null;
        item.note = (fd.get('note')||'').trim();
      } else {
        item.title = (fd.get('title')||'').trim();
        if(!item.title) return;
        if(fd.has('extra')) item.extra = (fd.get('extra')||'').trim();
        if(fd.has('rating') && fd.get('rating')) item.rating = fd.get('rating');
        item.note = (fd.get('note')||'').trim();
      }
      state[catId][key].push(item);
      openForms[`${catId}-${key}`] = false;
      await saveData();
      render();
    });
  });
  document.querySelectorAll('form[data-pref]').forEach(form=>{
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const key = form.dataset.pref;
      const fd = new FormData(form);
      const text = (fd.get('text')||'').trim();
      if(!text) return;
      state.preferences[key].push({ id: uid(), text });
      await saveData();
      render();
    });
  });
}

function updateSearchRowState(){
  const row = document.querySelector('.search-row');
  if(!row) return;
  row.classList.toggle('has-query', !!searchQuery.trim());
}

function setupSearchInput(){
  const input = document.getElementById('searchInput');
  const clearBtn = document.getElementById('searchClear');
  input.addEventListener('input', ()=>{
    searchQuery = input.value;
    updateSearchRowState();
    render();
  });
  clearBtn.addEventListener('click', ()=>{
    searchQuery = '';
    input.value = '';
    updateSearchRowState();
    input.focus();
    render();
  });
}

async function init(){
  await loadData();
  document.getElementById('subtitle').textContent =
    'Bøker, filmer, serier, spill og aktiviteter – Vi liker, Jeg liker, og anbefalinger, lagret automatisk.';
  setupSearchInput();
  render();
}

init();
</script>
</body>
